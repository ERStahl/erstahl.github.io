<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Drift - Official Author Website</title>
  <style>
    :root {
      --cold-surface: #0a0d12;
      --cold-line: #1e2530;
      --text-color: #f1f5f9;
      --text-muted: #94a3b8;
      --accent-color: #38bdf8;
      --btn-brace: #0284c7;
      --btn-text: #ffffff;
      --star-color: #f59e0b;
      --nav-bg: rgba(10, 13, 18, 0.85);
    }
    body { margin: 0; padding: 0; background-color: #05070a; font-family: -apple-system, sans-serif; color: var(--text-color); padding-top: 70px; }
    .container { max-width: 1200px; margin: 0 auto; padding: 0 1.5rem; box-sizing: border-box; }
    .navbar { position: fixed; top: 0; left: 0; width: 100%; height: 70px; background-color: var(--nav-bg); backdrop-filter: blur(12px); border-bottom: 1px solid var(--cold-line); z-index: 1000; }
    .navbar .container { display: flex; justify-content: space-between; align-items: center; height: 100%; }
    .navbar__brand { font-size: 1.15rem; font-weight: 800; text-transform: uppercase; color: var(--text-color); text-decoration: none; }
    .navbar__brand span { color: var(--accent-color); }
    .navbar__nav { display: flex; gap: 2rem; list-style: none; margin: 0; padding: 0; }
    .navbar__link { font-size: 0.85rem; font-weight: 600; text-transform: uppercase; color: var(--text-muted); text-decoration: none; }
    .navbar__link:hover { color: var(--accent-color); }
    .lang-selector { margin-left: 20px; font-size: 0.75rem; font-weight: 700; display: flex; gap: 5px; }
    .hero { padding: 8rem 0; border-bottom: 1px solid var(--cold-line); }
    .hero__title { font-size: 3.5rem; font-weight: 900; margin-bottom: 2rem; }
    .section-books, .section-reviews, .section-prequel { padding: 6rem 0; border-bottom: 1px solid var(--cold-line); }
    .grid-system { display: grid; gap: 2.5rem; margin-top: 3rem; grid-template-columns: 1fr; }
    @media (min-width: 768px) { .grid-system { grid-template-columns: repeat(2, 1fr); } .grid-system--3-col { grid-template-columns: repeat(3, 1fr); } }
    .drift-card { background: rgba(255, 255, 255, 0.01); border: 1px solid var(--cold-line); padding: 2.5rem; border-radius: 4px; }
    .btn { display: inline-block; padding: 1rem 2rem; border-radius: 4px; text-decoration: none; font-weight: 600; text-align: center; background-color: var(--btn-brace); color: var(--btn-text); }
  </style>
</head>
<body>
  <nav class="navbar">
    <div class="container">
      <a href="/" class="navbar__brand">The<span>Drift</span></a>
      <div style="display: flex; align-items: center;">
        <ul class="navbar__nav">
          <li><a href="#hero" class="navbar__link">Home</a></li>
          <li><a href="#books" class="navbar__link">Books</a></li>
          <li><a href="#reviews" class="navbar__link">Reviews</a></li>
          <li><a href="#prequel" class="navbar__link">Prequel</a></li>
        </ul>
        <div class="lang-selector">
          <a href="/" class="navbar__link" style="color: #fff;">EN</a>
          <span style="color: var(--text-muted);">|</span>
          <a href="/it/" class="navbar__link">IT</a>
        </div>
      </div>
    </div>
  </nav>

  <header id="hero" class="hero">
    <div class="container">
      <h1 class="hero__title">Time is Monitored. Life is Currency.</h1>
      <p style="font-size: 1.25rem; color: var(--text-muted); max-width: 700px;">
        Dive into a hard-hitting sci-fi universe where every second lived is registered, owned, and traded by an elite class.
      </p>
      <a href="#books" class="btn">Browse Available Records</a>
    </div>
  </header>
  <!-- ... (rest of the content) ... -->
</body>
</html>
